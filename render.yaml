services:
  - type: web
    name: huiyi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && pip install uv && uv sync && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
